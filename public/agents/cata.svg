<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cata-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="cata-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cata-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadow-cata" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#cata-bg)" filter="url(#shadow-cata)" opacity="0.95"/>
  <circle cx="60" cy="60" r="50" fill="#0c1220"/>

  <!-- Dynamic Hair Updo / Ponytail -->
  <circle cx="60" cy="34" r="14" fill="url(#cata-hair)"/>
  <!-- Hair Base -->
  <path d="M34 58 C32 38 88 38 86 58 C86 76 34 76 34 58 Z" fill="url(#cata-hair)"/>

  <!-- Face -->
  <circle cx="60" cy="60" r="23" fill="url(#cata-skin)"/>

  <!-- Hair Details -->
  <path d="M36 48 C44 40 76 40 84 48 C76 44 44 44 36 48 Z" fill="url(#cata-hair)"/>

  <!-- Persuasive Expressive Eyes -->
  <ellipse cx="49" cy="58" rx="3.5" ry="4" fill="#0f172a"/>
  <ellipse cx="71" cy="58" rx="3.5" ry="4" fill="#0f172a"/>
  <circle cx="50" cy="56" r="1.3" fill="#ffffff"/>
  <circle cx="72" cy="56" r="1.3" fill="#ffffff"/>

  <!-- Big Warm Friendly Smile -->
  <path d="M51 68 Q60 77 69 68" fill="#e11d48" stroke="#be123c" stroke-width="1.5"/>
  <path d="M53 68 Q60 72 67 68 Z" fill="#ffffff"/>

  <!-- Cheerful Cheeks -->
  <ellipse cx="43" cy="65" rx="3" ry="1.8" fill="#fb7185" opacity="0.7"/>
  <ellipse cx="77" cy="65" rx="3" ry="1.8" fill="#fb7185" opacity="0.7"/>

  <!-- Dealmaker Star Badge -->
  <circle cx="92" cy="32" r="12" fill="#f59e0b"/>
  <polygon points="92,24 94,29 100,30 95,34 97,40 92,36 87,40 89,34 84,30 90,29" fill="#fffbeb"/>
</svg>
