<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tito-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tito-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow-tito" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#tito-bg)" filter="url(#shadow-tito)" opacity="0.95"/>
  <circle cx="60" cy="60" r="50" fill="#0c1220"/>

  <!-- Robot/Android Inspector Head -->
  <rect x="36" y="38" width="48" height="42" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Antenna -->
  <line x1="60" y1="38" x2="60" y2="24" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="22" r="4" fill="#ef4444"/>

  <!-- Inspector Monocle / Visor Lens -->
  <!-- Left Eye: Tech Lens -->
  <circle cx="49" cy="56" r="9" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="49" cy="56" r="4.5" fill="#22d3ee"/>
  <line x1="42" y1="56" x2="56" y2="56" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>
  <line x1="49" y1="49" x2="49" y2="63" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>

  <!-- Right Eye: Magnifying / Grumpy Eye -->
  <circle cx="72" cy="56" r="11" fill="#f59e0b" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="72" cy="56" r="8" fill="#1e293b"/>
  <rect x="66" y="52" width="12" height="3" fill="#f59e0b" transform="rotate(-10 72 53)"/>
  <circle cx="73" cy="57" r="3.5" fill="#f8fafc"/>
  <circle cx="74" cy="57" r="1.5" fill="#0f172a"/>

  <!-- Slightly Grumpy Mouth -->
  <path d="M50 72 Q60 67 70 71" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tech bolts -->
  <circle cx="34" cy="58" r="2" fill="#64748b"/>
  <circle cx="86" cy="58" r="2" fill="#64748b"/>

  <!-- Small wrench icon badge -->
  <circle cx="92" cy="90" r="12" fill="#f59e0b"/>
  <path d="M88 86 L96 94 M91 85 L95 89" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
</svg>
