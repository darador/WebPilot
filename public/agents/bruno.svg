<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bruno-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bruno-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="shadow-bruno" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#bruno-bg)" filter="url(#shadow-bruno)" opacity="0.95"/>
  <circle cx="60" cy="60" r="50" fill="#0c1220"/>

  <!-- Face -->
  <circle cx="60" cy="62" r="24" fill="url(#bruno-skin)"/>

  <!-- Creative Beanie Hat (Gorro moderno) -->
  <path d="M36 50 C36 28 84 28 84 50 C84 55 36 55 36 50 Z" fill="#047857"/>
  <rect x="34" y="47" width="52" height="8" rx="4" fill="#10b981"/>
  <!-- Beanie top fold -->
  <circle cx="60" cy="28" r="4" fill="#059669"/>

  <!-- Wild Creative Hair Strands -->
  <path d="M35 55 Q30 65 37 72" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M85 55 Q90 65 83 72" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Expressive Eyes -->
  <circle cx="50" cy="63" r="3.2" fill="#0f172a"/>
  <circle cx="70" cy="63" r="3.2" fill="#0f172a"/>
  <circle cx="51.5" cy="61.5" r="1.2" fill="#ffffff"/>
  <circle cx="71.5" cy="61.5" r="1.2" fill="#ffffff"/>

  <!-- Light Beard / Stubble -->
  <path d="M48 76 C52 82 68 82 72 76" stroke="#b45309" stroke-width="1.8" stroke-dasharray="1.5 2" fill="none"/>

  <!-- Enthusiastic Grin -->
  <path d="M52 72 Q60 78 68 72" fill="none" stroke="#065f46" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Designer Stylus Pin -->
  <circle cx="92" cy="88" r="12" fill="#10b981"/>
  <polygon points="86,84 94,92 98,90 92,82" fill="#f8fafc"/>
  <polygon points="84,82 86,84 92,82" fill="#047857"/>
</svg>
