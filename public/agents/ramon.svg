<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ramon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ramon-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="shadow-ramon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#ramon-bg)" filter="url(#shadow-ramon)" opacity="0.95"/>
  <circle cx="60" cy="60" r="50" fill="#0c1220"/>

  <!-- Face -->
  <circle cx="60" cy="58" r="25" fill="url(#ramon-skin)"/>

  <!-- Distinguished Graying Hair -->
  <path d="M34 54 C33 34 87 34 86 54 C80 38 40 38 34 54 Z" fill="#94a3b8"/>
  <!-- Hair Sides -->
  <path d="M34 52 C32 64 36 68 37 70 C35 65 34 58 34 52 Z" fill="#cbd5e1"/>
  <path d="M86 52 C88 64 84 68 83 70 C85 65 86 58 86 52 Z" fill="#cbd5e1"/>

  <!-- Experienced Meticulous Eyebrows -->
  <path d="M44 51 Q50 49 55 52" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M65 52 Q70 49 76 51" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Sharp Eyes -->
  <circle cx="50" cy="57" r="2.8" fill="#0f172a"/>
  <circle cx="70" cy="57" r="2.8" fill="#0f172a"/>
  <circle cx="51" cy="56" r="0.9" fill="#ffffff"/>
  <circle cx="71" cy="56" r="0.9" fill="#ffffff"/>

  <!-- Neat Gray Mustache & Beard (Experienced Craftsmanship) -->
  <path d="M46 68 Q54 65 60 69 Q66 65 74 68 Q60 74 46 68 Z" fill="#64748b"/>
  <ellipse cx="60" cy="77" rx="6" ry="3.5" fill="#94a3b8"/>

  <!-- Firm but fair mouth line -->
  <line x1="56" y1="71" x2="64" y2="71" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- QA Checkmark Badge -->
  <circle cx="92" cy="88" r="12" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M87 88 L91 92 L98 84" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
