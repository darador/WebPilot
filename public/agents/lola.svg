<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="lola-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lola-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="lola-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="lola-glasses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Bubble -->
  <circle cx="60" cy="60" r="54" fill="url(#lola-bg)" filter="url(#shadow)" opacity="0.95"/>
  <circle cx="60" cy="60" r="50" fill="#0c1220"/>

  <!-- Back Hair -->
  <path d="M30 65 C25 85 40 95 60 95 C80 95 95 85 90 65 C85 45 35 45 30 65 Z" fill="url(#lola-hair)"/>

  <!-- Head/Face -->
  <circle cx="60" cy="58" r="26" fill="url(#lola-skin)"/>

  <!-- Hair Front -->
  <path d="M35 52 C45 35 75 35 85 52 C80 40 70 38 60 40 C50 38 40 40 35 52 Z" fill="url(#lola-hair)"/>
  <!-- Side Bangs -->
  <path d="M34 50 C33 62 38 68 40 70 C37 65 35 55 35 50 Z" fill="url(#lola-hair)"/>
  <path d="M86 50 C87 62 82 68 80 70 C83 65 85 55 85 50 Z" fill="url(#lola-hair)"/>

  <!-- Modern Smart Glasses -->
  <rect x="42" y="52" width="14" height="10" rx="3" fill="none" stroke="url(#lola-glasses)" stroke-width="2.5"/>
  <rect x="64" y="52" width="14" height="10" rx="3" fill="none" stroke="url(#lola-glasses)" stroke-width="2.5"/>
  <line x1="56" y1="56" x2="64" y2="56" stroke="url(#lola-glasses)" stroke-width="2"/>
  <!-- Eyes behind glasses -->
  <circle cx="49" cy="57" r="2.5" fill="#1e293b"/>
  <circle cx="71" cy="57" r="2.5" fill="#1e293b"/>
  <circle cx="50" cy="56" r="0.8" fill="#ffffff"/>
  <circle cx="72" cy="56" r="0.8" fill="#ffffff"/>

  <!-- Cheerful Smile -->
  <path d="M54 70 Q60 76 66 70" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="44" cy="66" rx="3" ry="1.5" fill="#f472b6" opacity="0.6"/>
  <ellipse cx="76" cy="66" rx="3" ry="1.5" fill="#f472b6" opacity="0.6"/>

  <!-- Mini Headset/Mic -->
  <path d="M38 56 C34 58 34 66 38 70 L48 74" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <circle cx="49" cy="74" r="2.5" fill="#06b6d4"/>

  <!-- Tech Sparkle Badge -->
  <polygon points="90,28 92,34 98,36 92,38 90,44 88,38 82,36 88,34" fill="#f43f5e"/>
</svg>
