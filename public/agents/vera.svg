<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="vera-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="vera-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="vera-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow-vera" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#vera-bg)" filter="url(#shadow-vera)" opacity="0.95"/>
  <circle cx="60" cy="60" r="50" fill="#0c1220"/>

  <!-- Sleek Hair Bob Cut -->
  <path d="M34 50 C32 30 88 30 86 50 C88 75 78 85 75 85 C75 75 72 70 60 70 C48 70 45 75 45 85 C42 85 32 75 34 50 Z" fill="url(#vera-hair)"/>

  <!-- Face -->
  <circle cx="60" cy="58" r="24" fill="url(#vera-skin)"/>

  <!-- Stylish Bangs -->
  <path d="M36 46 C45 36 75 36 84 46 C75 42 60 42 36 46 Z" fill="url(#vera-hair)"/>

  <!-- Analytical Angular Glasses -->
  <polygon points="43,52 55,50 54,60 44,61" fill="none" stroke="#a855f7" stroke-width="2"/>
  <polygon points="65,50 77,52 76,61 66,60" fill="none" stroke="#a855f7" stroke-width="2"/>
  <line x1="55" y1="50" x2="65" y2="50" stroke="#a855f7" stroke-width="2"/>

  <!-- Eyes behind glasses -->
  <circle cx="49" cy="56" r="2.2" fill="#312e81"/>
  <circle cx="71" cy="56" r="2.2" fill="#312e81"/>
  <circle cx="50" cy="55" r="0.7" fill="#ffffff"/>
  <circle cx="72" cy="55" r="0.7" fill="#ffffff"/>

  <!-- Confident Smile -->
  <path d="M55 70 Q60 73 66 69" fill="none" stroke="#7e22ce" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Hologram Chart Pin -->
  <circle cx="92" cy="36" r="13" fill="#312e81" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="86" y1="42" x2="89" y2="38" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="89" y1="38" x2="93" y2="40" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="93" y1="40" x2="98" y2="31" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
